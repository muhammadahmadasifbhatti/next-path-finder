name: 'Report PR Status'
description: 'Reports build status back to PR using GitHub Commit Status API'
inputs:
  pr-number:
    description: 'Pull request number'
    required: true
  status:
    description: 'Status to report (pending, success, failure)'
    required: true
  description:
    description: 'Status description'
    required: true
  context:
    description: 'Status context name'
    required: true
  github-token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Report status to PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { owner, repo } = context.repo;
          const pr_number = ${{ inputs.pr-number }};
          
          // Get PR details for comment events
          const pr = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: pr_number
          });
          const sha = pr.data.head.sha;
          
          // Set commit status
          await github.rest.repos.createCommitStatus({
            owner,
            repo,
            sha: sha,
            state: '${{ inputs.status }}',
            description: '${{ inputs.description }}',
            context: '${{ inputs.context }}'
          });
          
          console.log(`Status '${{ inputs.status }}' reported for PR #${pr_number} (${sha})`);
