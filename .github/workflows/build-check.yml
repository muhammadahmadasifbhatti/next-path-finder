name: Build Check

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@bci build check')

    steps:
      - name: Get PR details and Checkout Code
        uses: ./.github/actions/get-and-checkout-pr

      - name: Set PR status to pending
        uses: ./.github/actions/report-pr-status
        with:
          pr-number: ${{ github.event.issue.number }}
          status: "pending"
          description: "Build check in progress..."
          context: ${{ github.workflow }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        id: build
        run: npm run build

      - name: Report execution status
        if: always()
        uses: ./.github/actions/report-pr-status
        with:
          pr-number: ${{ github.event.issue.number }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          description: ${{ job.status == 'success' && 'Build completed successfully' || 'Build failed' }}
          context: ${{ github.workflow }}
