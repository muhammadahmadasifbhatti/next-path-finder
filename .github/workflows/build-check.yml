name: Build Check

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@bci build check')
    
    steps:
      - name: Set PR status to pending
        uses: ./.github/actions/report-pr-status
        with:
          pr-number: ${{ github.event.issue.number }}
          status: 'pending'
          description: 'Build check in progress...'
          context: ${{ github.workflow }}
      
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            
            core.setOutput('repository', pr.data.head.repo.full_name);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            
            return {
              repository: pr.data.head.repo.full_name,
              ref: pr.data.head.ref,
              sha: pr.data.head.sha
            };

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ steps.pr-details.outputs.repository }}
          ref: ${{ steps.pr-details.outputs.ref }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run build
        id: build
        run: npm run build
        
      - name: Report execution status
        if: always()
        uses: ./.github/actions/report-pr-status
        with:
          pr-number: ${{ github.event.issue.number }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          description: ${{ job.status == 'success' && 'Build completed successfully!' || 'Build failed!' }}
          context: ${{ github.workflow }}
