name: Build Check

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@bci build check')
    
    steps:
      - name: Set PR status to pending
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            const sha = pr.data.head.sha;
            
            // Set status to pending
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sha,
              state: 'pending',
              description: 'Build check in progress...',
              context: 'Build Check'
            });
      
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            
            core.setOutput('repository', pr.data.head.repo.full_name);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            
            return {
              repository: pr.data.head.repo.full_name,
              ref: pr.data.head.ref,
              sha: pr.data.head.sha
            };

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ steps.pr-details.outputs.repository }}
          ref: ${{ steps.pr-details.outputs.ref }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run build
        id: build
        run: npm run build
        
      - name: Set PR status to success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            const sha = pr.data.head.sha;
            
            // Set status to success
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sha,
              state: 'success',
              description: 'Build completed successfully!',
              context: 'Build Check'
            });
            
      - name: Set PR status to failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            const sha = pr.data.head.sha;
            
            // Set status to failure
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sha,
              state: 'failure',
              description: 'Build failed!',
              context: 'Build Check'
            });
