name: Build Check

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@bci build check')
    
    steps:
      - name: Set PR status to pending
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr_number, sha;
            
            if (context.eventName === 'pull_request') {
              pr_number = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
            } else {
              pr_number = context.issue.number;
              // Get PR details for comment events
              const pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr_number
              });
              sha = pr.data.head.sha;
            }
            
            // Set status to pending
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sha,
              state: 'pending',
              description: 'Build check in progress...',
              context: 'Build Check'
            });
      
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            // Get PR details for comment events
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            
            core.setOutput('repository', pr.data.head.repo.full_name);
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            
            return {
              repository: pr.data.head.repo.full_name,
              ref: pr.data.head.ref,
              sha: pr.data.head.sha
            };

      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ steps.pr-details.outputs.repository }}
          ref: ${{ steps.pr-details.outputs.ref }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run build
        id: build
        run: npm run build
        
      - name: Set PR status to success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr_number, sha;
            
            if (context.eventName === 'pull_request') {
              pr_number = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
            } else {
              pr_number = context.issue.number;
              // Get PR details for comment events
              const pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr_number
              });
              sha = pr.data.head.sha;
            }
            
            // Find the check run we created earlier
            const checkRuns = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              check_name: 'Build Check'
            });
            
            const checkRun = checkRuns.data.check_runs.find(run => run.name === 'Build Check');
            
            if (checkRun) {
              // Update existing check run to success
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: checkRun.id,
                status: 'completed',
                conclusion: 'success',
                completed_at: new Date().toISOString(),
                output: {
                  title: 'Build Check',
                  summary: 'Build completed successfully!'
                }
              });
            }
            
            // Add success comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: '✅ **Build Check Passed!** \n\nThe build completed successfully. Hurray!'
            });
        
      - name: Set PR status to failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr_number, sha;
            
            if (context.eventName === 'pull_request') {
              pr_number = context.payload.pull_request.number;
              sha = context.payload.pull_request.head.sha;
            } else {
              pr_number = context.issue.number;
              // Get PR details for comment events
              const pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr_number
              });
              sha = pr.data.head.sha;
            }
            
            // Set status to failure
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sha,
              state: 'failure',
              description: 'Build failed!',
              context: 'Build Check / build'
            });
            
            // Add failure comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: '❌ **Build Check Failed!** \n\nThe build encountered errors. Please check the workflow logs for details.'
            });
