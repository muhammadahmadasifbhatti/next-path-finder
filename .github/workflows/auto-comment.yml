name: Auto Comment

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Add build check comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;
            
            // Add the build check comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: '@bci build check'
            });
